services:
  server:
    environment:
      # Playwright runs the whole suite from one client IP; the per-IP auth
      # limits would 429 page loads. Tests only.
      STROEM__AUTH__RATE_LIMIT__ENABLED: "false"
  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    ipc: host
    init: true
    working_dir: /app/ui
    volumes:
      - ./ui:/app/ui
    depends_on:
      server:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      BASE_URL: http://server:8080
      CI: "true"
    command: >
      bash -c "cd /app/ui && npm install -g bun && bun install && bunx playwright install --with-deps chromium && bunx playwright test"
