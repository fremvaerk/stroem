[package]
name = "stroem-db"
version.workspace = true
edition.workspace = true
# One integration-test binary per crate: tests/main.rs declares every test
# file as a module. A new test file is a `mod` line there, not a new target.
autotests = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
stroem-common.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true
stroem-test-support.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
