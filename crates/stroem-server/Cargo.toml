[package]
name = "stroem-server"
version.workspace = true
edition.workspace = true
# One integration-test binary per crate: tests/main.rs declares every test
# file as a module. A new test file is a `mod` line there, not a new target.
autotests = false

[features]
default = ["s3", "mcp"]
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
mcp = ["dep:rmcp", "dep:schemars", "dep:http"]

# No tests in main.rs: skip building an empty test binary.
[[bin]]
name = "stroem-server"
path = "src/main.rs"
test = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sqlx.workspace = true
stroem-agent.workspace = true
stroem-common.workspace = true
stroem-db.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
argon2.workspace = true
jsonwebtoken.workspace = true
sha2.workspace = true
# Used to render sha2 digests as lowercase hex strings; replaces format!("{:x}", ...)
# which broke when sha2 0.11 switched Output from GenericArray to hybrid_array::Array
# (the new Array doesn't implement LowerHex).
hex = "0.4"
rust-embed.workspace = true
mime_guess.workspace = true
async-trait.workspace = true
git2.workspace = true
notify.workspace = true
blake2.workspace = true
flate2.workspace = true
tar.workspace = true
clap.workspace = true
config.workspace = true
croner.workspace = true
chrono-tz.workspace = true
tokio-util = { workspace = true, features = ["io"] }
openidconnect.workspace = true
url.workspace = true
axum-extra = { version = "0.12", features = ["cookie"] }
tower_governor = { version = "0.8", features = ["axum"] }
subtle = "2"
base64 = "0.23"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
rand = "0.10"
walkdir = "2"
dashmap = "6"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
# default features include `rustls` which pulls aws-smithy-runtime/tls-rustls →
# aws-smithy-http-client/legacy-rustls-ring → rustls 0.21 + rustls-webpki 0.101
# (advisories RUSTSEC-2024-0336 / GHSA-mvb-cxhh-fwh6). The `default-https-client`
# feature already gives us TLS via rustls 0.23 + aws-lc, so the legacy `rustls`
# feature is redundant and only adds the vulnerable copy. Drop it.
aws-sdk-s3 = { version = "1.127", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"], optional = true }
aws-config = { version = "1", optional = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
stroem-test-support.workspace = true
# Still needed directly: the S3 tests (s3_integration_test.rs,
# log_peak_alloc_test.rs) start their own MinIO container via
# tests/common/minio.rs.
testcontainers = { version = "0.28" }
http = "1"
http-body-util = "0.1"
tokio-tungstenite = "0.30"
futures-util = "0.3"
walkdir = "2"
aws-sdk-s3 = { version = "1.127", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-config = "1"
regex-lite = "0.1"
serial_test = "4"

# Counting global allocator, one read at a time: needs its own main.
[[test]]
name = "log_peak_alloc_test"
path = "tests/log_peak_alloc_test.rs"
harness = false

[[test]]
name = "integration"
path = "tests/main.rs"
