[package]
name = "stroem-common"
version.workspace = true
edition.workspace = true
# One integration-test binary per crate: tests/main.rs declares every test
# file as a module. A new test file is a `mod` line there, not a new target.
autotests = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
redact.workspace = true
serde_yaml.workspace = true
tera.workspace = true
tera-contrib.workspace = true
uuid.workspace = true
tracing.workspace = true
croner.workspace = true
chrono-tz.workspace = true
url.workspace = true
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
