[package]
name = "stroem-e2e"
version.workspace = true
edition.workspace = true
# One integration-test binary per crate: tests/main.rs declares every test
# file as a module. A new test file is a `mod` line there, not a new target.
autotests = false
# No lib — tests only

[dev-dependencies]
stroem-server = { path = "../stroem-server" }
stroem-worker = { path = "../stroem-worker", default-features = false }
stroem-db = { path = "../stroem-db" }
stroem-common = { path = "../stroem-common" }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
stroem-test-support.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
