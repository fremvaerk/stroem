[package]
name = "stroem-cli"
version.workspace = true
edition.workspace = true
# One integration-test binary per crate: tests/main.rs declares every test
# file as a module. A new test file is a `mod` line there, not a new target.
autotests = false

[[bin]]
name = "stroem"
path = "src/stroem.rs"

[[bin]]
name = "stroem-api"
path = "src/stroem_api.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
flate2.workspace = true
reqwest.workspace = true
serde_json.workspace = true
stroem-common.workspace = true
stroem-runner = { workspace = true, default-features = false }
tar.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
tempfile.workspace = true
wiremock = "0.6"

[[test]]
name = "integration"
path = "tests/main.rs"
