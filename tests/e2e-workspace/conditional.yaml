actions:
  say:
    type: script
    runner: local
    language: shell
    script: echo "ran"

tasks:
  conditional-report:
    mode: distributed
    input:
      run_check:
        type: boolean
        default: false
    flow:
      # Skipped by its own condition. report tolerates that skip via its own
      # accept set (0.18: continue_when_skipped is retired — the dependent's
      # own edge decides tolerance now, not an upstream flag).
      optional-check:
        action: say
        when: "{{ input.run_check }}"
      report:
        action: say
        depends_on:
          - step: optional-check
            accept: [completed, skipped]

      # Skipped by the same condition but with no tolerant accept set on its
      # dependent: follow-up is omitted (unreachable).
      plain-check:
        action: say
        when: "{{ input.run_check }}"
      follow-up:
        action: say
        depends_on: [plain-check]

      # Strict AND (0.17): a merge of a completed step and an unflagged skip
      # is skipped; with a tolerant accept set on the skipped branch it runs.
      always:
        action: say
      plain-merge:
        action: say
        depends_on: [always, plain-check]
      cws-merge:
        action: say
        depends_on:
          - always
          - step: optional-check
            accept: [completed, skipped]
